name = "otp-bridge-relay"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# Pairing map only: pairingId -> push subscription.
# Codes are never written here, or anywhere else.
[[kv_namespaces]]
binding = "PAIRINGS"
id = "36d66fbcf869486983e1c0a49d300003"

# Static assets, served on the same origin as the API. The setup walkthrough video is
# 2 MB — far beyond what a Worker script bundle can carry — but assets are uploaded
# separately and are not subject to the script size limit.
#
# Same-origin matters here beyond tidiness: the setup page ships a strict CSP, and
# hosting the video elsewhere would mean opening `media-src` to a third-party origin.
# A request matching a file here is served directly; everything else reaches the Worker.
[assets]
directory = "./public"

# Delivery for browsers with no push service (ungoogled-chromium forks). One object per
# pairing ID, holding a hibernatable WebSocket. Codes pass through its memory and are
# never written to storage — see src/socket.ts.
[[durable_objects.bindings]]
name = "SOCKETS"
class_name = "PairingSocket"

# SQLite-backed classes are the ones available without a paid plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PairingSocket"]

[vars]
VAPID_SUBJECT = "mailto:klukakbusiness@gmail.com"

# VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY are secrets:
#   npx wrangler secret put VAPID_PRIVATE_KEY
#   npx wrangler secret put VAPID_PUBLIC_KEY

# Aggregate request outcomes only. See the `track()` comment in src/index.ts for the hard
# exclusion list: no pairing ID, no IP, no country, no code, no endpoint URL.
#
# Do NOT enable [observability] / Workers Logs to get this breakdown instead. Those capture
# request URLs, and `GET /setup?p=<pairingId>` would then write a live bearer token into a
# retained log.
# The dataset is created implicitly by the first writeDataPoint — there is nothing to
# create in the dashboard. Analytics Engine does have to be enabled for the account first,
# though: declaring this binding before that fails every deploy with error 10089.
[[analytics_engine_datasets]]
binding = "OPS"
dataset = "relay_ops"

# Abuse protection without burning KV writes.
[[unsafe.bindings]]
name = "CODE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "PAIR_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
